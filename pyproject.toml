[project]
name = "verification-gap"
version = "0.1.0"
description = "The verification gap in self-testing code agents: experiments, instrument, and paper."
requires-python = ">=3.11,<3.13"
dependencies = [
    "evalplus>=0.3.1",
    "pytest>=8.0",
    "scipy>=1.11",
    "matplotlib>=3.9",
    "langgraph>=0.6",
    "langchain-litellm>=0.1",
    "litellm>=1.70",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgap"]

[tool.pytest.ini_options]
testpaths = ["experiments", "src"]
