# The five templates on the live TDD path (v4): four load-bearing prompts rewritten in v3,
# failure_analysis rewritten in v4 (the pointwise/system_code_quality wrapper pair retired
# with it — see REVIEW.md v4 note).
default:
  fence_close: '```'
  fence_open: '```'
  max_retries: 3
  style: standard

agents:
  code/python_generate_tests_simple:
    template: agents/code/python_generate_tests_simple.j2
  code/python_generate_from_tests:
    template: agents/code/python_generate_from_tests.j2
  judge/test_quality:
    template: judge/test_quality.j2
  judge/code_against_tests:
    template: judge/code_against_tests.j2
  judge/failure_analysis:
    template: judge/failure_analysis.j2
